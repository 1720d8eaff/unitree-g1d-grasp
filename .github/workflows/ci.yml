name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify source manifest
        run: python tools/verify_manifest.py
      - name: Run offline integrity tests
        run: python -m unittest discover -s tests -v
      - name: Run project doctor
        run: ./g1dctl doctor
