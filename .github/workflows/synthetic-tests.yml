name: Synthetic buffer tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_synthetic_buffer.py tests/test_ipc_behavior.py
      - run: python tools/timing_probe.py --output ci-timing
      - uses: actions/upload-artifact@v4
        with:
          name: host-timing
          path: ci-timing/
